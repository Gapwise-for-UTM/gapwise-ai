name: Materialize npm lockfile

on:
  push:
    branches: [feat/private-mcp-foundation]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/private-mcp-foundation
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Remove implementation scratch notes
        run: |
          rm -f \
            docs/BUILD_SCOPE.md \
            docs/CLIENT_SECURITY.md \
            docs/IMPLEMENTATION_STATUS.md \
            docs/NO_LOGGING.md \
            docs/OPENAPI.md \
            docs/PRIVACY_COPY.md \
            docs/PRODUCTION_MIGRATION.md \
            docs/PROVIDER_NEUTRALITY.md \
            docs/READY_FOR_CI.md
      - name: Commit deterministic dependency state and cleanup
        run: |
          if git diff --quiet && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package-lock.json docs
          git commit -m "chore: finalize AI service repository hygiene"
          git push origin HEAD:feat/private-mcp-foundation
